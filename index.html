<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fame the Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0b0618;font-family:'Outfit',system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
#wrap{position:absolute;left:50%;top:50%;width:480px;height:800px;transform-origin:center center;overflow:hidden;background:#000;border-radius:14px;box-shadow:0 0 80px rgba(255,120,200,.25)}
#c{position:absolute;inset:0;width:480px;height:800px;display:block}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center}
.screen.on{display:flex}
.btn{font-family:'Bungee',sans-serif;font-size:22px;border:none;border-radius:16px;padding:14px 26px;cursor:pointer;color:#1a0b2e;background:linear-gradient(180deg,#ffe27a,#f5b52e);box-shadow:0 5px 0 #a8701a,0 10px 24px rgba(0,0,0,.4);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a8701a}
.btn.alt{background:linear-gradient(180deg,#ff7ac3,#d63c95);color:#fff;box-shadow:0 5px 0 #8a1f5c,0 10px 24px rgba(0,0,0,.4)}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:none;font-size:15px;padding:10px 16px}
.btn.sm{font-size:14px;padding:8px 14px;border-radius:11px;box-shadow:0 3px 0 #a8701a}
.btn[disabled]{filter:grayscale(1) brightness(.6);cursor:default}
.coinpill{display:inline-flex;align-items:center;gap:8px;background:rgba(0,0,0,.45);border:2px solid rgba(255,214,90,.6);border-radius:30px;padding:6px 14px 6px 8px;font-weight:800;font-size:18px}
.coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6c4,#ffd23f 45%,#c98a0b);box-shadow:inset 0 0 0 2px #e0a420;display:inline-block;flex:none}
/* menu */
#menu{background:linear-gradient(180deg,rgba(15,6,35,.55),rgba(15,6,35,.2) 40%,rgba(15,6,35,.85));justify-content:flex-start;padding-top:40px}
.title{font-family:'Bungee',sans-serif;font-size:58px;line-height:.95;text-align:center;background:linear-gradient(180deg,#fff3b0,#ffc83d 50%,#ff8a3d);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #6a1d5a) drop-shadow(0 0 18px rgba(255,120,190,.7));transform:rotate(-3deg)}
.subtitle{margin-top:10px;font-size:14px;letter-spacing:3px;text-transform:uppercase;color:#ffc7ea;opacity:.9}
#avatar{margin-top:6px;width:240px;height:270px}
.menuinfo{display:flex;gap:10px;align-items:center;margin-top:4px}
.rank{font-weight:800;font-size:14px;color:#9fe8ff;text-transform:uppercase;letter-spacing:1.5px;margin-top:10px}
.idle{font-size:13px;color:#d9c8ff;margin-top:4px;min-height:18px}
.menubtns{display:flex;flex-direction:column;gap:14px;margin-top:18px;align-items:center}
.howto{position:absolute;bottom:18px;font-size:12.5px;color:#cbb8f0;text-align:center;line-height:1.5;padding:0 30px}
#muteBtn{position:absolute;top:14px;right:14px}
/* hud */
#hud{position:absolute;inset:0;pointer-events:none;display:none}
#hud.on{display:block}
#hud .tl{position:absolute;top:14px;left:14px;font-family:'Bungee';font-size:24px;text-shadow:0 3px 0 rgba(0,0,0,.5)}
#hud .tl small{display:block;font-family:'Outfit';font-size:12px;font-weight:600;opacity:.8;letter-spacing:1px}
#hud .tr{position:absolute;top:14px;right:64px}
#pauseBtn{position:absolute;top:12px;right:12px;width:42px;height:42px;border-radius:12px;border:none;background:rgba(0,0,0,.45);color:#fff;font-size:18px;pointer-events:auto;cursor:pointer}
#pups{position:absolute;top:66px;right:14px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.pup{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.45);border-radius:20px;padding:4px 10px;font-size:13px;font-weight:800}
.pup .bar{width:70px;height:6px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden}
.pup .bar i{display:block;height:100%;background:#ffd23f}
#nowplaying{position:absolute;bottom:14px;left:14px;font-size:12px;opacity:.75;font-weight:600}
/* overlays */
.panel{background:linear-gradient(180deg,#2a1452,#170a30);border:2px solid rgba(255,200,90,.35);border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#over,#pause{background:rgba(10,4,24,.72);justify-content:center}
#over .panel,#pause .panel{width:380px;padding:26px 24px;text-align:center}
#over h2,#pause h2{font-family:'Bungee';font-size:34px;color:#ff7ac3;text-shadow:0 3px 0 #4a0f35}
.stats{margin:16px 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:rgba(255,255,255,.07);border-radius:14px;padding:10px}
.stat b{display:block;font-family:'Bungee';font-size:24px;color:#ffd23f}
.stat span{font-size:12px;opacity:.75;text-transform:uppercase;letter-spacing:1px}
.tipbox{background:rgba(120,200,255,.1);border-left:4px solid #6fd3ff;border-radius:10px;padding:10px 12px;text-align:left;font-size:13.5px;line-height:1.45;margin-bottom:16px;color:#dff4ff}
.tipbox b{color:#9fe8ff}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
/* studio */
#studio{background:linear-gradient(180deg,#1d0c3a,#0e0620);}
.shead{width:100%;display:flex;align-items:center;justify-content:space-between;padding:14px 14px 8px}
.shead h2{font-family:'Bungee';font-size:22px;color:#ffd23f}
.tabs{display:flex;gap:6px;padding:0 14px;width:100%}
.tab{flex:1;font-family:'Bungee';font-size:13px;padding:9px 0;border-radius:12px 12px 0 0;border:none;background:rgba(255,255,255,.07);color:#cbb8f0;cursor:pointer}
.tab.on{background:#2a1452;color:#ffd23f}
.tabbody{flex:1;width:calc(100% - 28px);background:#2a1452;border-radius:0 0 16px 16px;overflow-y:auto;padding:12px;margin-bottom:14px;touch-action:pan-y}
.tabbody::-webkit-scrollbar{width:6px}.tabbody::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:3px}
#room{width:100%;height:auto;border-radius:12px;display:block;margin-bottom:10px}
.card{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.06);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.card .ic{font-size:28px;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.3);flex:none}
.card .info{flex:1;min-width:0}
.card .info b{font-size:15px}
.card .info .lv{font-size:11px;color:#ffd23f;font-weight:800;margin-left:6px}
.card .info p{font-size:12px;opacity:.75;margin-top:2px;line-height:1.3}
.pips{display:flex;gap:3px;margin-top:5px}.pips i{width:16px;height:5px;border-radius:3px;background:rgba(255,255,255,.15)}.pips i.f{background:#ffd23f}
.costbtn{display:flex;align-items:center;gap:5px;white-space:nowrap}
.costbtn .coin{width:15px;height:15px}
.label-top{display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.25);border-radius:14px;padding:12px;margin-bottom:10px}
.label-top .big{font-family:'Bungee';font-size:20px;color:#9fe8ff}
.label-top small{display:block;font-size:11px;opacity:.7;text-transform:uppercase;letter-spacing:1px}
.ava{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Bungee';font-size:18px;color:#1a0b2e;flex:none}
.section{font-family:'Bungee';font-size:13px;color:#cbb8f0;margin:12px 2px 8px;letter-spacing:1px}
.track.on{outline:2px solid #ffd23f}
.fact{font-size:12px;color:#bfe9ff;margin-top:4px;line-height:1.35}
.quizq{font-size:17px;font-weight:600;line-height:1.4;margin:6px 0 14px}
.qopt{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border-radius:12px;border:2px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff;font:600 15px 'Outfit';cursor:pointer}
.qopt.right{border-color:#3ddc97;background:rgba(61,220,151,.2)}
.qopt.wrong{border-color:#ff5f6d;background:rgba(255,95,109,.2)}
#toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%) translateY(-20px);width:420px;opacity:0;transition:all .3s;pointer-events:none;z-index:50;background:linear-gradient(180deg,#341a66,#21104a);border:2px solid #ffd23f;border-radius:16px;padding:12px 14px;font-size:13.5px;line-height:1.4;box-shadow:0 12px 30px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast b{color:#ffd23f}
#rotate{display:none}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>

  <!-- HUD -->
  <div id="hud">
    <div class="tl"><small>DISTANCE</small><span id="hDist">0</span></div>
    <div class="tr"><span class="coinpill"><i class="coin"></i><span id="hCoins">0</span></span></div>
    <button id="pauseBtn" aria-label="Pause">❚❚</button>
    <div id="pups"></div>
    <div id="nowplaying"></div>
  </div>

  <!-- MENU -->
  <div id="menu" class="screen on">
    <button class="btn ghost" id="muteBtn">🔊</button>
    <div class="title">FAME<br>THE GAME</div>
    <div class="subtitle">Run it up · Build the empire</div>
    <canvas id="avatar" width="480" height="540"></canvas>
    <div class="menuinfo"><span class="coinpill"><i class="coin"></i><span id="mCoins">0</span></span></div>
    <div class="rank" id="mRank"></div>
    <div class="idle" id="mIdle"></div>
    <div class="menubtns">
      <button class="btn" id="playBtn">▶ RUN</button>
      <button class="btn alt" id="studioBtn">🎛 STUDIO &amp; LABEL</button>
    </div>
    <div class="howto">← → switch lanes · ↑ jump · ↓ slide &nbsp;|&nbsp; swipe on mobile<br>Grab coins, upgrade your studio, sign artists, unlock new beats.</div>
  </div>

  <!-- GAME OVER -->
  <div id="over" class="screen">
    <div class="panel">
      <h2 id="oTitle">BUSTED!</h2>
      <div class="stats">
        <div class="stat"><b id="oDist">0</b><span>Distance</span></div>
        <div class="stat"><b id="oCoins">0</b><span>Coins earned</span></div>
        <div class="stat"><b id="oBest">0</b><span>Best run</span></div>
        <div class="stat"><b id="oBank">0</b><span>Bank</span></div>
      </div>
      <div class="tipbox" id="oTip"></div>
      <div class="row">
        <button class="btn" id="againBtn">RUN AGAIN</button>
        <button class="btn alt" id="oStudio">STUDIO</button>
      </div>
      <div style="margin-top:12px"><button class="btn ghost" id="oMenu">Main menu</button></div>
    </div>
  </div>

  <!-- PAUSE -->
  <div id="pause" class="screen">
    <div class="panel">
      <h2>PAUSED</h2>
      <p style="margin:12px 0 18px;opacity:.8">Take a breath. The beat waits for you.</p>
      <div class="row"><button class="btn" id="resumeBtn">RESUME</button><button class="btn alt" id="quitBtn">QUIT RUN</button></div>
    </div>
  </div>

  <!-- STUDIO -->
  <div id="studio" class="screen">
    <div class="shead">
      <button class="btn ghost" id="sBack">← Back</button>
      <h2>FAME RECORDS</h2>
      <span class="coinpill"><i class="coin"></i><span id="sCoins">0</span></span>
    </div>
    <div class="tabs">
      <button class="tab on" data-tab="studio">Studio</button>
      <button class="tab" data-tab="label">Label</button>
      <button class="tab" data-tab="music">Music</button>
      <button class="tab" data-tab="quiz">Quiz</button>
    </div>
    <div class="tabbody" id="tabbody"></div>
  </div>

  <div id="toast"></div>
</div>

<script>
/* =====================================================================
   FAME THE GAME — an endless runner + music-label tycoon
   ===================================================================== */

// ---------- Character look (tweak these to match Fame) ----------
const LOOK = {
  skin:'#e9b896', skinShade:'#c98f6c',
  hair:'#2a1c14',
  hoodie:'#15161d', hoodieShade:'#0b0b10', hoodieText:'#ffd23f',
  pants:'#34507f', pantsShade:'#24395c',
  shoes:'#f5f5f5', shoeAccent:'#e8323c',
  cap:'#111216', capLogo:'#ffd23f',
  chain:'#ffd34d', shades:'#111'
};

// ---------- Scaling ----------
const W=480, H=800;
const wrap=document.getElementById('wrap');
function fit(){const k=Math.min(innerWidth/W, innerHeight/H);wrap.style.transform=`translate(-50%,-50%) scale(${k})`;}
addEventListener('resize',fit);fit();

const cvs=document.getElementById('c'), ctx=cvs.getContext('2d');
const DPR=Math.min(2,(window.devicePixelRatio||1)*Math.min(innerWidth/W, innerHeight/H))||1;
cvs.width=Math.round(W*Math.max(1,DPR)); cvs.height=Math.round(H*Math.max(1,DPR));
ctx.setTransform(cvs.width/W,0,0,cvs.height/H,0,0);

// ---------- Persistence ----------
const KEY='fame_the_game_v1';
const DEF={coins:0,total:0,best:0,runs:0,studio:{mic:0,board:0,speakers:0,booth:0,decor:0},artists:{},track:0,quiz:0,quizRight:0,last:Date.now(),muted:false,seenTips:{}};
let S;
function load(){
  S=JSON.parse(JSON.stringify(DEF));
  try{const j=JSON.parse(localStorage.getItem(KEY)); if(j){Object.assign(S,j); S.studio=Object.assign({},DEF.studio,j.studio||{}); S.artists=j.artists||{};}}catch(e){}
}
function save(){S.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
load();

// ---------- Game data ----------
const ITEMS=[
 {id:'mic',name:'Microphone',icon:'🎤',base:100,mult:2.1,max:5,
  eff:l=>`Coins worth +${l*25}%`,
  tips:['<b>Dynamic vs condenser:</b> dynamic mics (like the classic SM58) handle loud voices on stage; condenser mics are more sensitive and catch every detail in the booth.',
        '<b>Pop filter:</b> that mesh screen in front of the mic stops “p” and “b” sounds from blasting air into the capsule — called plosives.',
        '<b>Mic distance:</b> rappers usually stay about a fist away. Closer adds bass (the proximity effect), farther sounds airy.',
        '<b>Gain staging:</b> set your input so your loudest bars peak around -10 dB — clipping at 0 dB can’t be fixed later.',
        '<b>Signature chain:</b> many hit vocals run mic → preamp → compressor → EQ. Your “vocal chain” is part of your sound.']},
 {id:'board',name:'Mixing Board',icon:'🎚️',base:120,mult:2.15,max:5,
  eff:l=>`Power-ups last +${l*2}s`,
  tips:['<b>Mixing</b> is balancing every track (drums, bass, vocals) so they sit together. <b>Mastering</b> is the final polish so the song sounds loud and consistent everywhere.',
        '<b>EQ</b> (equalization) boosts or cuts frequencies. Cutting muddy lows around 200–300 Hz is the oldest trick in the book.',
        '<b>Compression</b> evens out volume — it turns down the loud parts so quiet words don’t get lost.',
        '<b>Panning</b> places sounds left or right. Kick, bass and lead vocal usually stay dead center.',
        '<b>Reverb & delay</b> add space. A short delay echo on the last word of a bar is a hip-hop classic.']},
 {id:'speakers',name:'Studio Monitors',icon:'🔊',base:150,mult:2.3,max:5,
  eff:l=>`Unlocks beat #${Math.min(l+2,6)}`,
  tips:['<b>Studio monitors</b> have a flat frequency response — they tell the truth instead of hyping the bass like party speakers.',
        '<b>The car test:</b> engineers still check mixes in a car because that’s where tons of people actually listen.',
        '<b>Room matters:</b> bare walls bounce sound around. Even a rug and a bookshelf make your mix decisions better.',
        '<b>Sub-bass</b> (below ~60 Hz) is felt more than heard — that’s where an 808 lives.',
        '<b>Reference tracks:</b> pros A/B their mix against a released song they love to keep their ears honest.']},
 {id:'booth',name:'Vocal Booth',icon:'🚪',base:250,mult:2.4,max:4,
  eff:l=>`Artist slots: ${l+1}`,
  tips:['<b>Acoustic foam</b> absorbs reflections so the mic hears only your voice, not the room.',
        '<b>Punch-ins:</b> recording a verse in pieces and stitching the best takes together is totally normal — almost every hit does it.',
        '<b>Ad-libs</b> (“yeah!”, “let’s go!”) are usually recorded on separate tracks and tucked under the main vocal.',
        '<b>Doubles:</b> recording the same line twice and stacking it makes hooks sound huge.']},
 {id:'decor',name:'Label HQ Neon',icon:'💡',base:500,mult:2.5,max:5,
  eff:l=>`Artist income +${l*20}%`,
  tips:['<b>Branding</b> matters: a label’s logo, colors and visuals make fans recognize a release before they hit play.',
        '<b>Rollouts:</b> labels plan singles, visuals and social content weeks before an album drops.',
        '<b>Merch</b> is a huge income stream — fans love wearing the brand.',
        '<b>Live shows</b> often earn artists more than streams do.',
        '<b>Community</b> builds empires: local shows and features with hometown artists grow a real fanbase.']},
];
function itemCost(it,l){return Math.round(it.base*Math.pow(it.mult,l));}

const ARTISTS=[
 {id:'palm', name:'Lil Palmetto', genre:'Florida bounce', cost:150,  rate:10,  color:'#3ddc97'},
 {id:'nova', name:'Nova Reign',   genre:'R&B singer',     cost:600,  rate:35,  color:'#ff7ac3'},
 {id:'bricks',name:'Bricks Mercado',genre:'Street rap',   cost:2000, rate:100, color:'#ff9f43'},
 {id:'saint',name:'Saint Coral',  genre:'Melodic trap',   cost:6000, rate:280, color:'#54a0ff'},
 {id:'tidal',name:'Yung Tidal',   genre:'Pop-rap',        cost:18000,rate:800, color:'#c56cf0'},
];
const ARTIST_TIPS=[
 '<b>A&R</b> (Artists & Repertoire) is the label team that finds new talent and helps pick their songs.',
 '<b>Masters vs publishing:</b> the master is the actual recording; publishing is the song itself (lyrics + melody). They earn money separately.',
 '<b>Royalties</b> are payments every time a song is streamed, sold, played on radio or used in a video.',
 '<b>Streaming pays fractions of a cent per play</b> — that’s why artists need millions of streams, plus shows and merch.',
 '<b>A 360 deal</b> means the label takes a share of more than music — touring, merch and brand deals too.',
 '<b>Features</b> help artists cross fanbases. A verse from a bigger artist can introduce a newcomer to millions.',
];
function artistRate(a,l){return a.rate*(1+0.5*(l-1));}
function hitCost(a,l){return Math.round(a.cost*0.7*Math.pow(1.75,l-1));}
function slots(){return S.studio.booth+1;}
function signedCount(){return Object.keys(S.artists).length;}
function incomePerMin(){let t=0;for(const a of ARTISTS){const l=S.artists[a.id];if(l)t+=artistRate(a,l);}return t*(1+0.2*S.studio.decor);}
function coinValue(){return 1+0.25*S.studio.mic;}
function pupDur(){return 8+2*S.studio.board;}

const RANKS=[[0,'Bedroom Producer'],[1000,'Mixtape Hustler'],[5000,'Indie Label'],[20000,'Regional Buzz'],[75000,'Major Player'],[250000,'FAME EMPIRE']];
function rankName(){let r=RANKS[0][1];for(const [t,n] of RANKS) if(S.total>=t) r=n; return r;}
function nextRank(){for(const [t,n] of RANKS) if(S.total<t) return [t,n]; return null;}

// Beats (procedurally synthesized)
const TRACKS=[
 {name:'Cape Coral Sunset',style:'Lo-fi chill',bpm:80,swing:.18,
  kick:'x.........x.x...',snare:'....x.......x...',hat:'x.x.x.x.x.x.x.x.',
  bass:'x.........x.....',chords:[[53,57,60,64],[52,55,59,62],[50,53,57,60],[48,52,55,59]],pad:'triangle',arp:null,
  fact:'<b>BPM</b> = beats per minute. Lo-fi usually sits around 70–90 BPM, which is why it feels laid-back.'},
 {name:'Gulf Coast Bounce',style:'Southern bounce',bpm:100,swing:.08,
  kick:'x..x..x...x..x..',snare:'....x.......x...',hat:'xxxxxxxxxxxxxxxx',
  bass:'x..x..x...x..x..',chords:[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],pad:'square',arp:'x.x.x.x.x.x.x.x.',
  fact:'<b>Syncopation</b> means hitting off the main beat. That bouncy kick pattern lands “between” counts — that’s the bounce.'},
 {name:'Trap Grind 24/7',style:'Trap',bpm:140,swing:0,half:true,
  kick:'x......x..x.....',snare:'........x.......',hat:'x.x.xrx.x.x.x.rr',
  bass:'x......x..x.....',b808:true,chords:[[48,51,55],[44,48,51],[41,44,48],[43,47,50]],pad:'sawtooth',arp:'x...x...x...x.x.',
  fact:'<b>The 808</b> is named after the Roland TR-808 drum machine (1980). Its long, booming kick became the bass of trap music.'},
 {name:'Fame Records Anthem',style:'Boom bap',bpm:92,swing:.14,
  kick:'x......xx.x.....',snare:'....x.......x...',hat:'x.x.x.x.x.x.x.xo',
  bass:'x......x..x.....',chords:[[50,53,57,60],[46,50,53,57],[43,46,50,53],[45,49,52,55]],pad:'sawtooth',stab:'x.....x.........',arp:null,
  fact:'<b>Boom bap</b> is named after the sound of its drums — “boom” (kick) and “bap” (snare). It ruled 90s hip-hop.'},
 {name:'Neon Palms',style:'Synthwave',bpm:116,swing:0,
  kick:'x...x...x...x...',snare:'....x.......x...',hat:'..o...o...o...o.',
  bass:'xxxxxxxxxxxxxxxx',octBass:true,chords:[[45,48,52],[41,45,48],[48,52,55],[43,47,50]],pad:'sawtooth',arp:'xxxxxxxxxxxxxxxx',
  fact:'<b>Four on the floor</b> = a kick on every beat. It’s the heartbeat of disco, house and synthwave.'},
 {name:'Platinum Empire',style:'Victory trap',bpm:145,swing:0,half:true,
  kick:'x.....x...x..x..',snare:'........x.......',hat:'x.x.x.x.xrx.rrrr',

// ---------- Audio ----------
let AC=null,master,musicBus,sfxBus,noiseBuf,seqTimer=null,curTrack=-1,step=0,nextT=0,bar=0;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=S.muted?0:.8;master.connect(AC.destination);
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(master);
  musicBus=AC.createGain();musicBus.gain.value=.55;musicBus.connect(comp);
  sfxBus=AC.createGain();sfxBus.gain.value=.5;sfxBus.connect(comp);
  noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
const mf=m=>440*Math.pow(2,(m-69)/12);
function env(g,t,a,peak,dec){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec);}
function kick(t,v=1){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.13);env(g,t,.003,v,.32);o.connect(g).connect(musicBus);o.start(t);o.stop(t+.4);}
function noise(t,dur,hp,v,bus=musicBus,lp){const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=AC.createGain();env(g,t,.002,v,dur);let n=s.connect(f);if(lp){const l=AC.createBiquadFilter();l.type='lowpass';l.frequency.value=lp;n=n.connect(l);}n.connect(g).connect(bus);s.start(t,Math.random()*.5);s.stop(t+dur+.05);}
function snare(t){noise(t,.18,1200,.5);const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(140,t+.08);env(g,t,.002,.35,.1);o.connect(g).connect(musicBus);o.start(t);o.stop(t+.15);}
function hat(t,open){noise(t,open?.22:.045,7000,open?.18:.14);}
function tone(t,freq,dur,type,v,cut=1800,glideTo){const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();o.type=type;o.frequency.setValueAtTime(freq,t);if(glideTo)o.frequency.exponentialRampToValueAtTime(glideTo,t+dur*.6);f.type='lowpass';f.frequency.value=cut;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.setValueAtTime(v,t+dur*.6);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(f).connect(g).connect(musicBus);o.start(t);o.stop(t+dur+.05);}
function scheduleStep(T,s,t){
  const sd=60/T.bpm/4;
  const ch=T.chords[bar%T.chords.length];
  if(T.kick[s]==='x')kick(t, T.b808?0.9:1);
  if(T.snare[s]==='x')snare(t);
  const h=T.hat[s];
  if(h==='x')hat(t,false); else if(h==='o')hat(t,true); else if(h==='r'){hat(t,false);hat(t+sd/3,false);hat(t+2*sd/3,false);}
  if(T.bass[s]==='x'){
    const root=ch[0]-12;
    if(T.b808){tone(t,mf(root-12)*1.5,sd*6,'sine',.75,400,mf(root-12));}
    else if(T.octBass){tone(t,mf(root-12+(s%2?12:0)),sd*.9,'sawtooth',.22,500);}
    else tone(t,mf(root-12),sd*3,T.pad==='square'?'sawtooth':'sine',.4,520);
  }
  if(s===0){for(const n of ch)tone(t,mf(n),sd*15,T.pad,T.pad==='sawtooth'?.035:.06,T.pad==='sawtooth'?1100:2200);}
  if(T.stab&&T.stab[s]==='x'){for(const n of ch)tone(t,mf(n+12),sd*1.5,'sawtooth',.05,2600);}
  if(T.arp&&T.arp[s]==='x'){const n=ch[(s+bar)%ch.length]+12+(s%8>=4&&T.half?12:0);tone(t,mf(n),sd*.9,T.half?'sine':'square',T.half?.09:.045,3200);}
}
function seqTick(){
  if(!AC||curTrack<0)return;const T=TRACKS[curTrack];const sd=60/T.bpm/4;
  while(nextT<AC.currentTime+.12){
    const sw=(step%2)?T.swing*sd:0;
    scheduleStep(T,step,nextT+sw);
    nextT+=sd;step=(step+1)%16;if(step===0)bar++;
  }
}
function playTrack(i){
  initAudio();if(!AC)return;curTrack=i;step=0;bar=0;nextT=AC.currentTime+.06;
  if(!seqTimer)seqTimer=setInterval(seqTick,25);
  document.getElementById('nowplaying').textContent='♪ '+TRACKS[i].name;
}
function sfxCoin(){if(!AC)return;const t=AC.currentTime;[1318,1976].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;env(g,t+i*.05,.002,.08,.12);o.connect(g).connect(sfxBus);o.start(t+i*.05);o.stop(t+i*.05+.15);});}
function sfxJump(){if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(700,t+.15);env(g,t,.005,.2,.18);o.connect(g).connect(sfxBus);o.start(t);o.stop(t+.25);}
function sfxSlide(){if(!AC)return;noise(AC.currentTime,.25,800,.25,sfxBus,3000);}
function sfxCrash(){if(!AC)return;const t=AC.currentTime;noise(t,.5,100,.8,sfxBus,2500);const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(200,t);o.frequency.exponentialRampToValueAtTime(40,t+.5);env(g,t,.005,.4,.5);o.connect(g).connect(sfxBus);o.start(t);o.stop(t+.6);}
function sfxPower(){if(!AC)return;const t=AC.currentTime;[523,659,784,1046].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;env(g,t+i*.06,.003,.07,.15);o.connect(g).connect(sfxBus);o.start(t+i*.06);o.stop(t+i*.06+.2);});}
function sfxBuy(){if(!AC)return;const t=AC.currentTime;[784,1175].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;env(g,t+i*.08,.003,.15,.25);o.connect(g).connect(sfxBus);o.start(t+i*.08);o.stop(t+i*.08+.3);});}
function setMuted(m){S.muted=m;if(master)master.gain.value=m?0:.8;document.getElementById('muteBtn').textContent=m?'🔇':'🔊';save();}

// ---------- 3D projection ----------
const F=430, CAMH=3.0, PZ=4.2, LANE=1.25;
const HOR=Math.round(0.8*H - CAMH*F/PZ);
let camX=0;
function P(x,y,z){const s=F/z;return {x:W/2+(x-camX)*s, y:HOR+(CAMH-y)*s, s};}
const laneX=l=>(l-1)*LANE;
function poly(pts,fill){ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.closePath();ctx.fillStyle=fill;ctx.fill();}
function drawBox(cx,w,y0,h,z,d,front,top,side){
  const z1=Math.max(z,1.0),z2=z+d;if(z2<=1.0)return null;
  const l=cx-w/2,r=cx+w/2;
  const a=P(l,y0+h,z1),b=P(r,y0+h,z1),c=P(r,y0,z1),e=P(l,y0,z1);
  const a2=P(l,y0+h,z2),b2=P(r,y0+h,z2),c2=P(r,y0,z2),e2=P(l,y0,z2);
  if(y0+h<CAMH)poly([a,b,b2,a2],top);
  if(l>camX)poly([a,a2,e2,e],side);else if(r<camX)poly([b,b2,c2,c],side);
  poly([a,b,c,e],front);
  return {x:a.x,y:a.y,w:b.x-a.x,h:e.y-a.y,s:a.s,clipped:z<1.0};
}

const STARS=[...Array(70)].map(()=>({x:Math.random()*W,y:Math.random()*HOR*.6,r:Math.random()*1.4+.3,p:Math.random()*6}));
const SKY=[];{let x=-60;while(x<W+60){const w=18+Math.random()*34;SKY.push({x,w,h:20+Math.random()*70,win:Math.random()<.6});x+=w+2;}}
const FARPALMS=[...Array(9)].map((_,i)=>({x:i*62+Math.random()*30-20,h:40+Math.random()*30}));

// ---------- Run state ----------
let mode='menu', R=null, shake=0, flash=0, T=0;
function newWorld(){return {dist:0,speed:9,lane:1,x:0,y:0,vy:0,slide:0,objs:[],scen:[],nextRow:34,nextScen:2,coins:0,magnet:0,dbl:0,alive:true,dead:0,anim:0,picked:0,bill:0};}
R=newWorld();
function rnd(a,b){return a+Math.random()*(b-a);}
const TRAIN_COLS=[['#18b6a8','#0f7f76','#7ff0e4'],['#e8458b','#a62a60','#ffb0d4'],['#f5b52e','#b07a12','#ffe39a'],['#6b6bff','#4141b8','#c8c8ff']];
function spawnRow(z){
  const lanes=[0,1,2].sort(()=>Math.random()-.5);
  const hard=Math.min(.45,R.dist/2500);
  const nBlock=Math.random()<.3+hard?2:1;
  let trainUsed=false;
  for(let i=0;i<nBlock;i++){
    const ln=lanes[i],r=Math.random();
    let type=(!trainUsed&&r<.32)?'train':(r<.68?'low':'high');
    if(type==='train'){trainUsed=true;const d=rnd(7,12);R.objs.push({k:'train',lane:ln,x:laneX(ln),z,d,col:TRAIN_COLS[Math.floor(Math.random()*4)]});
    }else{
      R.objs.push({k:type,lane:ln,x:laneX(ln),z,d:.3});
      if(type==='low'&&Math.random()<.55)for(let j=-3;j<=3;j++){const u=j/3;R.objs.push({k:'coin',x:laneX(ln),y:.5+1.15*(1-u*u),z:z+j*1.0});}
    }
  }
  const free=lanes[nBlock];
  if(Math.random()<.75){
    const pu=Math.random()<.07, n=5;
    for(let j=0;j<n;j++){
      if(pu&&j===2)R.objs.push({k:Math.random()<.5?'magnet':'dbl',x:laneX(free),y:.7,z:z-4+j*1.6});
      else R.objs.push({k:'coin',x:laneX(free),y:.5,z:z-4+j*1.6});
    }
  }
}
const BCOLS=['#f7a1c4','#7fd6d0','#ffc59a','#b9a6ff','#ffe08a','#9fd8ff'];
function spawnScen(z){
  for(const side of [-1,1]){
    const r=Math.random();
    R.bill+=1;
    if(R.bill>16&&Math.random()<.25){R.bill=0;R.scen.push({k:'bill',x:side*3.6,z,side});continue;}
    if(r<.5)R.scen.push({k:'palm',x:side*rnd(2.75,3.2),z:z+rnd(0,2),h:rnd(3.4,4.6),lean:rnd(-.25,.25)*side});
    else if(r<.85){const w=rnd(2,3.4);R.scen.push({k:'bld',x:side*(3.9+w/2),z,w,h:rnd(2.6,6.5),d:rnd(3,4.6),col:BCOLS[Math.floor(Math.random()*BCOLS.length)]});}
    else R.scen.push({k:'lamp',x:side*2.75,z,side});
  }
}

// ---------- Input ----------
const keys={};
function act(a){
  if(mode!=='play'||!R.alive)return;
  if(a==='left'&&R.lane>0)R.lane--;
  else if(a==='right'&&R.lane<2)R.lane++;
  else if(a==='up'&&R.y<=0.001){R.vy=8.6;R.slide=0;sfxJump();}
  else if(a==='down'){if(R.y>0.05)R.vy=-16;R.slide=.62;sfxSlide();}
}
addEventListener('keydown',e=>{
  const k=e.key;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(k))e.preventDefault();
  if(e.repeat)return;
  if(k==='ArrowLeft'||k==='a'||k==='A')act('left');
  else if(k==='ArrowRight'||k==='d'||k==='D')act('right');
  else if(k==='ArrowUp'||k==='w'||k==='W'||k===' ')act('up');
  else if(k==='ArrowDown'||k==='s'||k==='S')act('down');
  else if((k==='p'||k==='P'||k==='Escape')&&mode==='play')pauseGame();
  else if((k==='Enter')&&(mode==='menu'||mode==='over'))startRun();
});
let sw=null;
wrap.addEventListener('pointerdown',e=>{if(mode!=='play')return;sw={x:e.clientX,y:e.clientY,done:false};});
wrap.addEventListener('pointermove',e=>{
  if(!sw||sw.done)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;
  if(Math.max(Math.abs(dx),Math.abs(dy))>26){sw.done=true;if(Math.abs(dx)>Math.abs(dy))act(dx<0?'left':'right');else act(dy<0?'up':'down');}
});
addEventListener('pointerup',()=>{sw=null;});

// ---------- Update ----------
function update(dt){
  T+=dt;
  if(shake>0)shake=Math.max(0,shake-dt*2.5);
  if(flash>0)flash=Math.max(0,flash-dt*3);
  const playing=mode==='play';
  if(mode==='pause')return;
  if(playing&&R.alive){R.speed=Math.min(30,12.5+R.dist/160);}
  else if(mode!=='play'){R.speed=9;}
  const sp=(playing&&!R.alive)?0:R.speed;
  const dz=sp*dt;
  R.dist+=dz;R.anim+=dt*(4+sp*.45);
  // objects
  for(const o of R.objs)o.z-=dz;
  for(const s of R.scen)s.z-=dz;
  R.objs=R.objs.filter(o=>o.z+(o.d||0)>0.6&&!o.gone);
  R.scen=R.scen.filter(s=>s.z+(s.d||0)>0.6);
  R.nextScen-=dz;while(R.nextScen<110){spawnScen(R.nextScen);R.nextScen+=5.2;}
  if(playing){R.nextRow-=dz;while(R.nextRow<95){spawnRow(R.nextRow);R.nextRow+=Math.max(9,15.5-R.dist/450)+rnd(0,4.5);}}
  if(!playing){camX+=(0-camX)*Math.min(1,dt*3);return;}
  if(!R.alive){R.dead+=dt;if(R.dead>1.1&&mode==='play')gameOver();return;}
  // player
  const tx=laneX(R.lane);R.x+=(tx-R.x)*Math.min(1,dt*15);
  R.vy-=26*dt;R.y+=R.vy*dt;if(R.y<0){R.y=0;R.vy=0;}
  if(R.slide>0)R.slide-=dt;
  if(R.magnet>0)R.magnet-=dt;if(R.dbl>0)R.dbl-=dt;
  camX+=(R.x*.55-camX)*Math.min(1,dt*6);
  // collisions
  const pl=Math.round(R.x/LANE)+1;
  for(const o of R.objs){
    if(o.k==='coin'||o.k==='magnet'||o.k==='dbl'){
      if(R.magnet>0&&o.k==='coin'&&o.z<14&&o.z>0){o.x+=(R.x-o.x)*Math.min(1,dt*10);o.y+=(R.y+.6-o.y)*Math.min(1,dt*10);o.z-=dt*10*Math.max(0,o.z-PZ)*.4;}
      if(Math.abs(o.z-PZ)<.65&&Math.abs(o.x-R.x)<.6&&Math.abs(o.y-(R.y+.6))<1.0){
        o.gone=true;
        if(o.k==='coin'){R.coins+=coinValue()*(R.dbl>0?2:1);R.picked++;sfxCoin();}
        else{if(o.k==='magnet')R.magnet=pupDur();else R.dbl=pupDur();sfxPower();flash=.4;}
      }
      continue;
    }
    if(Math.abs(o.x-R.x)>.62)continue;
    if(PZ+.25>o.z&&PZ-.25<o.z+o.d){
      if(o.k==='low'&&R.y>.62)continue;
      if(o.k==='high'&&R.slide>0)continue;
      crash();break;
    }
  }
}
function crash(){R.alive=false;R.dead=0;shake=1;flash=.8;sfxCrash();}

// ---------- Render ----------
function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,HOR);
  g.addColorStop(0,'#160a38');g.addColorStop(.45,'#5a2475');g.addColorStop(.8,'#e5577a');g.addColorStop(1,'#ffb066');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,HOR+2);
  for(const s of STARS){ctx.globalAlpha=.4+.4*Math.sin(T*2+s.p);ctx.fillStyle='#fff';ctx.fillRect(s.x,s.y,s.r,s.r);}
  ctx.globalAlpha=1;
  const sx=W/2-camX*6, sy=HOR-58;
  const sg=ctx.createLinearGradient(0,sy-80,0,sy+80);sg.addColorStop(0,'#fff27a');sg.addColorStop(1,'#ff5c8a');
  ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sx,sy,78,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=g;for(let i=0;i<6;i++){const yy=sy+8+i*11;ctx.fillRect(sx-90,yy,180,2+i*1.1);}
  // skyline
  ctx.fillStyle='#2c1048';
  for(const b of SKY){const x=b.x-camX*10;ctx.fillRect(x,HOR-b.h,b.w,b.h);}
  ctx.fillStyle='rgba(255,210,120,.55)';
  for(const b of SKY){if(!b.win)continue;const x=b.x-camX*10;for(let yy=HOR-b.h+6;yy<HOR-6;yy+=9)for(let xx=x+4;xx<x+b.w-4;xx+=7)if((xx*7+yy*3)%5<2)ctx.fillRect(xx,yy,2,3);}
  ctx.strokeStyle='#22093a';ctx.fillStyle='#22093a';ctx.lineWidth=3;
  for(const p of FARPALMS){const x=p.x-camX*14;ctx.beginPath();ctx.moveTo(x,HOR);ctx.quadraticCurveTo(x+6,HOR-p.h*.5,x+3,HOR-p.h);ctx.stroke();
    for(let i=0;i<6;i++){const a=i/6*Math.PI*2;ctx.beginPath();ctx.moveTo(x+3,HOR-p.h);ctx.quadraticCurveTo(x+3+Math.cos(a)*12,HOR-p.h-8,x+3+Math.cos(a)*20,HOR-p.h+Math.abs(Math.sin(a))*4+6);ctx.stroke();}}
}
function drawGround(){
  const g=ctx.createLinearGradient(0,HOR,0,H);g.addColorStop(0,'#7a4466');g.addColorStop(1,'#d79a6f');
  ctx.fillStyle=g;ctx.fillRect(0,HOR,W,H-HOR);
  // sidewalks
  poly([P(-2.35,0,1),P(-2.0,0,1),P(-2.0,0,400),P(-2.35,0,400)],'#9a6d86');
  poly([P(2.0,0,1),P(2.35,0,1),P(2.35,0,400),P(2.0,0,400)],'#9a6d86');
  poly([P(-2.0,0,1),P(2.0,0,1),P(2.0,0,400),P(-2.0,0,400)],'#4a3350');
  // ties
  const off=R.dist%1.4;
  for(let z=72-off;z>1;z-=1.4){
    const a=Math.min(1,(80-z)/30);ctx.globalAlpha=a;
    for(let l=0;l<3;l++){const x=laneX(l);poly([P(x-.56,0,z),P(x+.56,0,z),P(x+.56,0,z+.32),P(x-.56,0,z+.32)],'#6e4a43');}
  }
  ctx.globalAlpha=1;
  for(let l=0;l<3;l++){const x=laneX(l);for(const rx of [x-.38,x+.38]){poly([P(rx-.035,0,1),P(rx+.035,0,1),P(rx+.035,0,300),P(rx-.035,0,300)],'#d9d2e6');}}
  // horizon haze
  const hz=ctx.createLinearGradient(0,HOR-6,0,HOR+70);hz.addColorStop(0,'rgba(255,176,102,.9)');hz.addColorStop(1,'rgba(255,176,102,0)');
  ctx.fillStyle=hz;ctx.fillRect(0,HOR-6,W,76);
}
function fade(z){return Math.max(0,Math.min(1,(100-z)/22));}
function drawPalm(s){

function render(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake*16,(Math.random()-.5)*shake*16);
  drawSky();drawGround();
  const list=[...R.scen,...R.objs];
  const showPlayer=mode==='play'||mode==='pause'||mode==='over';
  if(showPlayer)list.push({k:'player',z:PZ+.001});
  list.sort((a,b)=>b.z-a.z);
  for(const o of list){
    if(o.z>100)continue;
    ctx.globalAlpha=o.k==='player'?1:fade(o.z);
    switch(o.k){
      case 'palm':drawPalm(o);break;case 'bld':drawBld(o);break;case 'lamp':drawLamp(o);break;case 'bill':drawBill(o);break;
      case 'train':drawTrain(o);break;case 'low':drawLow(o);break;case 'high':drawHigh(o);break;
      case 'coin':drawCoin(o);break;case 'magnet':case 'dbl':drawPup(o);break;
      case 'player':drawShadow();drawPlayer();break;
    }
  }
  ctx.globalAlpha=1;
  if(flash>0){ctx.fillStyle=`rgba(255,255,255,${flash*.35})`;ctx.fillRect(-20,-20,W+40,H+40);}

  ctx.restore();
}

  // monitors
  if(st.speakers>0){const sz=24+st.speakers*5;for(const sx of [w*.26,w*.68-sz+10]){c.fillStyle='#16161c';rr(c,sx,deskY-sz*1.4,sz,sz*1.4,4);c.fill();c.fillStyle='#333';c.beginPath();c.arc(sx+sz/2,deskY-sz*.45,sz*.32,0,7);c.fill();c.fillStyle=st.speakers>=4?'#ffd23f':'#666';c.beginPath();c.arc(sx+sz/2,deskY-sz*.45,sz*.12+Math.abs(Math.sin(T*8))*2,0,7);c.fill();c.fillStyle='#444';c.beginPath();c.arc(sx+sz/2,deskY-sz*1.1,sz*.15,0,7);c.fill();}}
  else{ghost(w*.25,deskY-56,36,50,'');ghost(w*.62,deskY-56,36,50,'');c.fillStyle='rgba(255,255,255,.35)';c.fillText('Monitors',w*.47,deskY-62);}
  // mic stand
  const mx=w*.12;
  if(st.mic>0){c.strokeStyle='#888';c.lineWidth=3;c.beginPath();c.moveTo(mx,h*.78);c.lineTo(mx,h*.4);c.lineTo(mx+18,h*.33);c.stroke();
    c.fillStyle=st.mic>=4?'#ffd23f':'#bbb';rr(c,mx+12,h*.24,14,30,7);c.fill();
    if(st.mic>=2){c.strokeStyle='rgba(200,200,200,.6)';c.lineWidth=2;c.beginPath();c.arc(mx+40,h*.3,14,0,7);c.stroke();}
    c.fillStyle='#666';c.fillRect(mx-14,h*.78-4,28,4);}
  else ghost(mx-20,h*.25,46,h*.5,'Mic');
}

// ---------- UI ----------
const $=id=>document.getElementById(id);
const fmt=n=>{n=Math.floor(n);if(n>=1e6)return (n/1e6).toFixed(n>=1e7?0:1)+'M';if(n>=1e4)return (n/1e3).toFixed(n>=1e5?0:1)+'K';return n.toLocaleString();};
function show(id){for(const s of ['menu','over','pause','studio'])$(s).classList.toggle('on',s===id);$('hud').classList.toggle('on',id==='hud');}
let toastQ=[],toastOn=false;
function toast(html){toastQ.push(html);if(!toastOn)nextToast();}
function nextToast(){const t=$('toast');if(!toastQ.length){toastOn=false;return;}toastOn=true;t.innerHTML=toastQ.shift();t.classList.add('show');setTimeout(()=>{t.classList.remove('show');setTimeout(nextToast,350);},4200);}
function refreshMenu(){
  $('mCoins').textContent=fmt(S.coins);$('mRank').textContent='★ '+rankName()+' ★';
  const ipm=incomePerMin();const nr=nextRank();
  $('mIdle').textContent=ipm>0?`Your label earns ${fmt(ipm)} coins/min — even while you’re away`:(nr?`Sign artists in the Label tab to earn while you’re away`:'');
}
function startRun(){
  initAudio();if(curTrack<0)playTrack(S.track);
  R=newWorld();R.speed=12.5;mode='play';show('hud');updatePups();
}
function gameOver(){
  mode='over';
  const earned=Math.floor(R.coins);S.coins+=earned;S.total+=earned;S.runs++;
  const d=Math.floor(R.dist);const nb=d>S.best;if(nb)S.best=d;save();
  $('oTitle').textContent=nb?'NEW RECORD!':['BUSTED!','OOF!','WIPEOUT!','SKRRT!'][Math.floor(Math.random()*4)];
  $('oDist').textContent=fmt(d)+'m';$('oCoins').textContent='+'+fmt(earned);$('oBest').textContent=fmt(S.best)+'m';$('oBank').textContent=fmt(S.coins);
  $('oTip').innerHTML=suggest();
  show('over');
}
function suggest(){
  // point the player at something affordable, otherwise a music fact
  const aff=ITEMS.filter(it=>S.studio[it.id]<it.max&&itemCost(it,S.studio[it.id])<=S.coins);
  if(aff.length){const it=aff[0];return `💡 <b>You can afford an upgrade!</b> ${it.icon} ${it.name} → ${it.eff(S.studio[it.id]+1)}. Head to the Studio.`;}
  const sa=ARTISTS.find(a=>!S.artists[a.id]&&a.cost<=S.coins&&signedCount()<slots());
  if(sa)return `💡 <b>You can sign ${sa.name}!</b> They’ll earn coins for your label while you run.`;
  const all=[...TRACKS.map(t=>t.fact),...ITEMS.flatMap(i=>i.tips.slice(0,1)),...ARTIST_TIPS];
  return '🎓 '+all[Math.floor(Math.random()*all.length)];
}
function pauseGame(){if(mode!=='play')return;mode='pause';show('pause');}
$('pauseBtn').onclick=e=>{e.stopPropagation();pauseGame();};
$('resumeBtn').onclick=()=>{mode='play';show('hud');};
$('quitBtn').onclick=()=>{mode='play';R.alive=false;R.dead=2;show('hud');};
$('playBtn').onclick=startRun;$('againBtn').onclick=startRun;
$('studioBtn').onclick=()=>openStudio();$('oStudio').onclick=()=>openStudio();
$('oMenu').onclick=()=>{mode='menu';R=newWorld();refreshMenu();show('menu');};
$('sBack').onclick=()=>{mode='menu';R=newWorld();refreshMenu();show('menu');};
$('muteBtn').onclick=()=>{initAudio();if(curTrack<0)playTrack(S.track);setMuted(!S.muted);};
setMuted(S.muted);

function updatePups(){
  const el=$('pups');let h='';const d=pupDur();
  if(R.magnet>0)h+=`<div class="pup">🧲 Magnet<div class="bar"><i style="width:${R.magnet/d*100}%"></i></div></div>`;
  if(R.dbl>0)h+=`<div class="pup">🎤 2X Coins<div class="bar"><i style="width:${R.dbl/d*100}%"></i></div></div>`;
  el.innerHTML=h;
}

// Studio panels
let curTab='studio';
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{curTab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));renderTab();});
function openStudio(){initAudio();if(curTrack<0)playTrack(S.track);mode='studio';show('studio');renderTab();}
function coinBtn(cost,label,id,dis){return `<button class="btn sm costbtn" data-act="${id}" ${dis?'disabled':''}>${label?label+' ':''}<i class="coin"></i>${fmt(cost)}</button>`;}
function pips(l,m){return '<div class="pips">'+[...Array(m)].map((_,i)=>`<i class="${i<l?'f':''}"></i>`).join('')+'</div>';}
function renderTab(){
  $('sCoins').textContent=fmt(S.coins);
  const b=$('tabbody');let h='';
  if(curTab==='studio'){
    h+=`<canvas id="room" width="440" height="230"></canvas>`;
    h+=`<div class="section">UPGRADES · boost your runs</div>`;
    for(const it of ITEMS){const l=S.studio[it.id],maxed=l>=it.max,c=itemCost(it,l);
      h+=`<div class="card"><div class="ic">${it.icon}</div><div class="info"><b>${it.name}</b><span class="lv">LV ${l}/${it.max}</span><p>${l?it.eff(l)+' now. ':''}${maxed?'Maxed out!':'Next: '+it.eff(l+1)}</p>${pips(l,it.max)}</div>
      ${maxed?'<span style="font-weight:800;color:#3ddc97">MAX</span>':coinBtn(c,'','item:'+it.id,S.coins<c)}</div>`;}
  }else if(curTab==='label'){
    const nr=nextRank();
    h+=`<div class="label-top"><div><small>Label rank</small><div class="big">${rankName()}</div>${nr?`<small style="margin-top:4px">Next: ${nr[1]} at ${fmt(nr[0])} lifetime coins (${fmt(S.total)})</small>`:''}</div><div style="text-align:right"><small>Income</small><div class="big" style="color:#ffd23f">${fmt(incomePerMin())}/min</div></div></div>`;
    h+=`<div class="section">ROSTER · ${signedCount()}/${slots()} SLOTS ${slots()<5?'· upgrade Vocal Booth for more':''}</div>`;
    for(const a of ARTISTS){const l=S.artists[a.id];
      if(l){const c=hitCost(a,l),mx=l>=10;
        h+=`<div class="card"><div class="ava" style="background:${a.color}">${a.name[0]}</div><div class="info"><b>${a.name}</b><span class="lv">${l} HIT${l>1?'S':''}</span><p>${a.genre} · ${fmt(artistRate(a,l)*(1+.2*S.studio.decor))}/min</p></div>${mx?'<span style="font-weight:800;color:#3ddc97">LEGEND</span>':coinBtn(c,'Drop hit','hit:'+a.id,S.coins<c)}</div>`;}
      else{const full=signedCount()>=slots();
        h+=`<div class="card" style="opacity:${full?.55:1}"><div class="ava" style="background:#444;color:#aaa">?</div><div class="info"><b>${a.name}</b><p>${a.genre} · earns ${fmt(a.rate*(1+.2*S.studio.decor))}/min</p></div>${full?'<span style="font-size:12px;opacity:.7">No slot</span>':coinBtn(a.cost,'Sign','sign:'+a.id,S.coins<a.cost)}</div>`;}
    }
  }else if(curTab==='music'){
    h+=`<div class="section">BEAT LIBRARY · upgrade Studio Monitors to unlock</div>`;
    TRACKS.forEach((t,i)=>{const un=trackUnlocked(i),on=S.track===i;
      h+=`<div class="card track ${on?'on':''}"><div class="ic">${un?(on?'🔊':'🎵'):'🔒'}</div><div class="info"><b>${un?t.name:'Locked beat'}</b><span class="lv">${t.bpm} BPM</span><p>${t.style}${un?'':' · Monitors LV '+i}</p>${un?`<div class="fact">${t.fact}</div>`:''}</div>${un?(on?'<span style="font-weight:800;color:#ffd23f">PLAYING</span>':`<button class="btn sm" data-act="play:${i}">Play</button>`):''}</div>`;});
  }else if(curTab==='quiz'){
    const q=QUIZ[S.quiz%QUIZ.length];
    h+=`<div class="section">STUDIO QUIZ · +40 coins per right answer</div>`;
    h+=`<div class="label-top"><div><small>Correct answers</small><div class="big">${S.quizRight}</div></div><div style="text-align:right"><small>Question</small><div class="big">${S.quiz%QUIZ.length+1}/${QUIZ.length}</div></div></div>`;
    h+=`<div class="quizq">${q[0]}</div>`;
    q[1].forEach((o,i)=>h+=`<button class="qopt" data-act="q:${i}">${o}</button>`);
  }
  b.innerHTML=h;
  if(curTab==='studio')drawRoom($('room'));
  b.querySelectorAll('[data-act]').forEach(el=>el.onclick=()=>doAct(el.dataset.act,el));
}
function doAct(a,el){
  const [k,v]=a.split(':');
  if(k==='item'){const it=ITEMS.find(x=>x.id===v),l=S.studio[v],c=itemCost(it,l);if(S.coins<c||l>=it.max)return;
    S.coins-=c;S.studio[v]++;sfxBuy();toast(`${it.icon} <b>${it.name} LV ${l+1}!</b> ${it.eff(l+1)}.<br><br>🎓 ${it.tips[Math.min(l,it.tips.length-1)]}`);
    if(v==='speakers'){toast(`🎵 <b>New beat unlocked:</b> ${TRACKS[S.studio.speakers].name}! Check the Music tab.`);}
  }
  else if(k==='sign'){const ar=ARTISTS.find(x=>x.id===v);if(S.coins<ar.cost||signedCount()>=slots())return;S.coins-=ar.cost;S.artists[v]=1;sfxBuy();
    toast(`✍️ <b>You signed ${ar.name}!</b> They now earn coins for Fame Records around the clock.<br><br>🎓 ${ARTIST_TIPS[(signedCount()-1)%ARTIST_TIPS.length]}`);}
  else if(k==='hit'){const ar=ARTISTS.find(x=>x.id===v),l=S.artists[v],c=hitCost(ar,l);if(S.coins<c)return;S.coins-=c;S.artists[v]++;sfxBuy();
    toast(`🔥 <b>${ar.name} dropped a hit!</b> Income up to ${fmt(artistRate(ar,l+1)*(1+.2*S.studio.decor))}/min.${Math.random()<.5?'<br><br>🎓 '+ARTIST_TIPS[Math.floor(Math.random()*ARTIST_TIPS.length)]:''}`);}
  else if(k==='play'){S.track=+v;playTrack(+v);}
  else if(k==='q'){
    const q=QUIZ[S.quiz%QUIZ.length],i=+v;const opts=$('tabbody').querySelectorAll('.qopt');
    opts.forEach((o,j)=>{o.onclick=null;if(j===q[2])o.classList.add('right');else if(j===i)o.classList.add('wrong');});
    if(i===q[2]){S.coins+=40;S.total+=40;S.quizRight++;sfxCoin();}else sfxCrash();
    S.quiz++;save();$('sCoins').textContent=fmt(S.coins);setTimeout(()=>{if(curTab==='quiz'&&mode==='studio')renderTab();},1300);return;
  }
  save();renderTab();
}

// ---------- Idle income ----------
(function offline(){
  const away=Math.min(4*3600,(Date.now()-S.last)/1000);const ipm=incomePerMin();
  if(away>30&&ipm>0){const earned=Math.floor(ipm*away/60);S.coins+=earned;S.total+=earned;save();setTimeout(()=>toast(`💸 <b>Welcome back!</b> Your artists earned <b>${fmt(earned)}</b> coins while you were away.`),800);}
})();
let idleAcc=0;
setInterval(()=>{const ipm=incomePerMin();if(ipm<=0)return;idleAcc+=ipm/60;const whole=Math.floor(idleAcc);if(whole>0){idleAcc-=whole;S.coins+=whole;S.total+=whole;}
  if(mode==='menu')refreshMenu();if(mode==='studio')$('sCoins').textContent=fmt(S.coins);},1000);
setInterval(save,5000);
addEventListener('visibilitychange',()=>{if(document.hidden){save();if(mode==='play')pauseGame();}});

// ---------- Main loop ----------
let last=performance.now(),roomTick=0;
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  update(dt);render();
  if(mode==='play'){$('hDist').textContent=fmt(R.dist)+'m';$('hCoins').textContent=fmt(R.coins);updatePups();}
  if(mode==='menu')drawAvatar();
  if(mode==='studio'&&curTab==='studio'){roomTick+=dt;if(roomTick>.12){roomTick=0;const r=$('room');if(r)drawRoom(r);}}
  requestAnimationFrame(loop);
}
refreshMenu();
if(S.runs===0)setTimeout(()=>toast('🎤 <b>Welcome to Fame the Game!</b> Run the tracks, stack coins, then build Fame Records into an empire.'),600);
requestAnimationFrame(loop);
</script>
